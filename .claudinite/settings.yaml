engine:
  channel: "staging"
  version: "1.61107.1"
  manifest: "sha512-hHAAsVgxkLWbrN11dWOBVOPHeZ7W1Feu3niaCciwRUSxxi2wCTo6JnqpHSnUrXYZs6UM3aN8RsYahwTPzP2d2Q=="
packs:
  channel: "canary"
  declared:
    - id: "shepherd"
      source: "local"
    - "basics"
    - "claudinite-lifecycle"
    - "git-github"
    - id: "claude-code-web-users-support"
      answers:
        store: "missingbulb/Shepherd"
      config:
        repo: "missingbulb/Shepherd"
    - "claudinite-growth"
    - "fleet-github"
tasks:
  routines:
    default:
      url: "https://api.anthropic.com/v1/claude_code/routines/trig_01Xc43XQwqjUgTaFQhXvAJdk/fire"
      tokenSecret: "CCR_ROUTINE_TOKEN"
  merge:
    "engine/update": "merge-safe-changes"
  frequency:
    "engine/update": "weekly"
fleet:
  owner: "missingbulb"
  kind: "user"
  exclude:
    - "missingbulb/empty"
    - "missingbulb/Sheepdog"
  staleDays: 14
  packSeeds:
    - id: "claude-code-web-users-support"
      config:
        repo: "missingbulb/Shepherd"
  packApprovalReview:
    approvers: ["@missingbulb"]
    requiredApprovals: 1
  globalPackVersionApproval:
    approvalRequiredPacks: []
    unlistedGlobalPackRequested: allowFromGlobalShelf
  packUsageInfractions:
    revokedPackUsage: reportOnly
    frozenVersionExceeded: reportOnly
  memberUpdateFrequency: daily
growth:
  sessionHistory: "localPlaintext"
