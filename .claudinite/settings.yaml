engine:
  channel: "staging"
  version: "1.61013.2"
  manifest: "sha512-Tb+shTgyAjeKLZn7FmzveZ6wliSye3SLoMfQuDdDfuO/HH9JMdtoZU5Vq9zHFmOG1ALmYoiAVl47Jyf3CWZYRw=="
packs:
  channel: "canary"
  declared:
    - "local/shepherd"
    - "basics"
    - "claudinite-lifecycle"
    - "git-github"
    - id: "claude-code-web-users-support"
      answers:
        store: "missingbulb/Shepherd"
      config:
        repo: "missingbulb/Shepherd"
    - "claudinite-growth"
tasks:
  routines:
    default:
      url: "https://api.anthropic.com/v1/claude_code/routines/trig_01Xc43XQwqjUgTaFQhXvAJdk/fire"
      tokenSecret: "CCR_ROUTINE_TOKEN"
fleet:
  owner: "missingbulb"
  kind: "user"
  exclude:
    - "missingbulb/empty"
    - "missingbulb/Sheepdog"
  staleDays: 14
  packSeeds:
    - id: "claude-code-web-users-support"
      config:
        repo: "missingbulb/Shepherd"
