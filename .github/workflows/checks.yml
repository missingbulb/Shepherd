# The repo's own unit tests. Claudinite's checks run in claudinite-ci.yml. The tests live in
# the local pack, under
# `.claudinite/`, which Node's default test discovery skips as a dot-directory — hence
# the explicit `find`. Further suites go in as further steps of this job, not as a
# second workflow.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The guard-check tests feed calls to the pinned engine's hook.
      - name: Install the pinned engine
        run: sh .claudinite/launch version

      - name: Unit tests
        run: node --test $(find .claudinite/local -name '*.test.mjs')
      # Claudinite's checks; the engine update keeps these steps current.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/claudinite
            ~/.npm/_cacache
          key: cn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.claudinite/settings.yaml') }}
          restore-keys: cn-${{ runner.os }}-${{ runner.arch }}-
      - name: install the engine settings.yaml pins
        run: npx --yes --prefer-offline @claudinite/setup@1.0.1
      - name: name the Claudinite checks build
        id: claudinite-checks
        continue-on-error: true
        run: .claudinite/bin/cn check key >> "$GITHUB_OUTPUT"
      - if: steps.claudinite-checks.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.claudinite-checks.outputs.dir }}
          key: claudinite-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.claudinite-checks.outputs.key }}
      - name: cn check work-and-world
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .claudinite/bin/cn check work-and-world
