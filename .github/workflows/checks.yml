# The repo's own unit tests. Claudinite's checks run in claudinite-ci.yml. The tests live in
# the local pack, under
# `.claudinite/`, which Node's default test discovery skips as a dot-directory — hence
# the explicit `find`. Further suites go in as further steps of this job, not as a
# second workflow.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The guard-check tests feed calls to the pinned engine's hook.
      - name: Install the pinned engine
        run: sh .claudinite/launch version

      - name: Unit tests
        run: node --test $(find .claudinite/local -name '*.test.mjs')
